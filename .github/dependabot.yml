version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      electron-and-packaging:
        patterns:
          - electron
          - '@electron/*'
      lint-and-types:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - '@types/node'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - '*'
